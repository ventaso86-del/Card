<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIM WEE KIAT | TECHBOND® Business Card</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Card Container */
        .card-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            position: relative;
        }

        /* Top Yellow Banner (Height increased to accommodate bigger logo) */
        .card-header {
            background-color: #FFEE00; /* TECHBOND Yellow */
            height: 135px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 15px 25px 0;
        }

        /* Logo Size Increased */
        .brand-logo-img {
            max-height: 75px; /* 从原先的 45px 放大到了 75px */
            max-width: 250px;
            object-fit: contain;
        }

        /* Profile Avatar with Red Border */
        .avatar-container {
            position: absolute;
            top: 55px;
            left: 20px;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #d32f2f;
            background: #fff;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Profile Info Section */
        .profile-section {
            padding: 45px 20px 15px;
            border-bottom: 1px solid #eee;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 800;
            color: #111;
            letter-spacing: 0.5px;
        }

        .profile-title {
            font-size: 15px;
            font-weight: 600;
            color: #555;
            margin-top: 2px;
        }

        /* Action Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 15px 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-zalo { background-color: #0068ff; }
        .btn-wa { background-color: #25d366; }
        .btn-email { background-color: #ea4335; grid-column: span 2; }

        /* Contact Details & Company Info */
        .info-list {
            padding: 10px 20px 25px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            font-size: 13px;
            color: #444;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            line-height: 1.4;
        }

        .info-item i {
            font-size: 16px;
            color: #d32f2f;
            width: 18px;
            text-align: center;
            margin-top: 2px;
        }

        .info-item a {
            color: #444;
            text-decoration: none;
        }

        .company-name {
            font-weight: 700;
            color: #111;
            margin-bottom: 3px;
        }

        .tax-id {
            font-size: 12px;
            color: #777;
            margin-top: 3px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Header Banner with Larger Logo -->
        <div class="card-header">
            <img src="https://lh3.googleusercontent.com/d/1Y1KXuECbPZWTy4oyCfdKcPumozw4AWWY" alt="TECHBOND Logo" class="brand-logo-img">
        </div>

        <!-- Avatar Image -->
        <div class="avatar-container">
            <img src="https://lh3.googleusercontent.com/d/1gLz5MFmt-EE2QLmJYTusXQI1XrDLFVuJ" alt="LIM WEE KIAT">
        </div>

        <!-- Personal Info -->
        <div class="profile-section">
            <h1 class="profile-name">LIM WEE KIAT</h1>
            <p class="profile-title">Sales Manager</p>
        </div>

        <!-- Quick Action Buttons -->
        <div class="action-buttons">
            <!-- Zalo -->
            <a href="https://zalo.me/84967269663" target="_blank" class="btn btn-zalo">
                <i class="fa-solid fa-comment"></i> Chat on Zalo
            </a>
            <!-- WhatsApp -->
            <a href="https://wa.me/84967269663" target="_blank" class="btn btn-wa">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </a>
            <!-- Email -->
            <a href="mailto:wklim@techbond.com.vn" class="btn btn-email">
                <i class="fa-regular fa-envelope"></i> Send Email
            </a>
        </div>

        <!-- Details -->
        <div class="info-list">
            <!-- Phone -->
            <div class="info-item">
                <i class="fa-solid fa-phone"></i>
                <div>
                    <a href="tel:+84862131353"><strong>+84 862131353</strong></a> (Direct)
                </div>
            </div>

            <!-- Website -->
            <div class="info-item">
                <i class="fa-solid fa-globe"></i>
                <div>
                    <a href="http://www.techbond.com.vn" target="_blank">www.techbond.com.vn</a>
                </div>
            </div>

            <!-- Address & Tax -->
            <div class="info-item">
                <i class="fa-solid fa-location-dot"></i>
                <div>
                    <div class="company-name">CÔNG TY TNHH TECHBOND MFG (VIỆT NAM)</div>
                    <div>Số 18 VSIP II-A, Đường số 23 Khu công nghiệp Việt Nam – Singapore II-A, Phường Vĩnh Tân, Thành phố Hồ Chí Minh</div>
                    <div class="tax-id">MST: 3702506829</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
